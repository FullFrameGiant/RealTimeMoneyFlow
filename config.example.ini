; 複製成 config.ini（start.bat 第一次執行會自動複製）
[shioaji]
; 金鑰：直接填，或用 key_file 沿用既有程式的 JSON（monitor_bot 用的 user_config.json 有 api_key / secret_key）
api_key =
secret_key =
key_file = C:\Users\Giant\.spyder-py3\user_config.json
simulation = false
; 用幾個連線訂閱逐筆 Tick（每個連線 200 檔；同一身分證最多 5 個連線）
; monitor_bot 盤中也會佔一個連線，所以這裡建議 1~2
connections = 1
per_connection = 200
; groups = 族群檔裡的股票優先訂閱逐筆，剩下名額依成交額補；turnover = 純依成交額
subscribe_priority = groups
; 收盤 13:35 後自動登出釋放連線（網頁仍可回放）
auto_logout = true

[universe]
; 族群檔：支援你的 stocks.txt（###分類、#股票、TOP_CLASS/TOP_STOCK），也支援 CSV / XLSX / JSON
; 留空 = 只用證交所/櫃買產業分類（跟原影片一樣）
group_file = C:\Users\Giant\.spyder-py3\stocks.txt
; 畫面上的名稱
custom_label = 我的族群
; 同時提供「產業別」頁籤（看全市場用）
show_industry = true
; stocks.txt 裡前面一個 # 的股票：照你的規則「盤中仍看所屬分類」，預設納入
include_commented = true
; 族群檔沒涵蓋的股票：drop=不放進我的族群（仍計入全市場與產業別）、other=歸「未分類」
unassigned = drop
; 是否把 ETF 算進全市場（獨立成「ETF」族群）
include_etf = false

[estimate]
; 沒訂閱 Tick 的股票，每幾秒用快照估算一次（0 = 不估算，只算有訂閱的）
snapshot_interval = 60
; 中途啟動 / 斷線重連時，用 Tick 裡的累計外盤量、內盤量補回漏掉的部分
repair = true
; check_env.py 若顯示方向相反才改成 true
side_swap = false
; 開盤、收盤集合競價的成交沒有主動方：true = 只算成交額、不算主動買賣（建議）；false = 照 shioaji 標的內外盤計入
auction_neutral = true

[power]
; 只在 Windows 有作用。執行期間切換成「省電」電源計畫；結束時（正常結束、Ctrl+C、按視窗的 X）先還原成原本的計畫
power_saver = true
; 執行期間不讓電腦進入睡眠（省電計畫預設閒置一陣子會睡眠，睡著就收不到行情）；螢幕仍會照設定關閉
keep_awake = true
; 當天幾點自動關機（台灣時間；程式還在執行才會關，提早關掉程式就不會關機）；留空 = 不關機
shutdown_at = 13:40
; 關機前倒數幾秒，這段時間內在命令提示字元執行 shutdown /a 可以取消
shutdown_countdown = 60

[server]
; 用 Tailscale serve / Cloudflare Tunnel 時維持 127.0.0.1 即可（由它們轉進來）
; 只有想在同一個 Wi-Fi 下直接用 http://電腦IP:8765 看時，才改成 0.0.0.0
host = 127.0.0.1
port = 8765
; 對外開放時建議設密碼（手機瀏覽器會跳出帳號密碼視窗）；留空 = 不需要密碼
username = kuo
password = rich
; 網頁多久向電腦要一次新資料（秒）。留空 = 電腦 1 秒、手機 2 秒。
; 改 15 可以再省手機流量，但數字每 15 秒才跳一次；電腦端的計算不受影響（每筆成交都會即時累加）
poll_seconds =
; 動畫每秒張數（5～60）。越低越省電，30 就很順
anim_fps = 30

[data]
; 保留最近幾個交易日的錄製（週末不算），更早的自動刪除；0 = 全部保留
keep_days = 4
; 今天以前的錄製自動壓縮成 .json.gz（約剩 1/3 大小），回放照樣能讀
compress = true
